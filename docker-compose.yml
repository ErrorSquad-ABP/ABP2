version: "3.9"

services:
  # ================= FRONTEND =================
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: abp2-front
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://server:3001}
    ports:
      - "${FRONT_HOST_PORT:-3002}:8080"   # host:container
    depends_on:
      - server

  # ================= BACKEND =================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: abp2-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://abp2:abp2pass@postgres:5432/abp2db}
      - PORT=3001
    ports:
      - "${SERVER_HOST_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================= DATABASE =================
  postgres:
    image: postgres:15
    container_name: abp2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abp2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abp2pass}
      POSTGRES_DB: ${POSTGRES_DB:-abp2db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abp2}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
